name: Refresh profile cards

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-cards.yml"

concurrency:
  group: refresh-profile-cards
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cards are rendered by the same public services the README used to hotlink,
      # then committed. Visitors load local SVGs, so a service outage can never
      # break the profile; the next run simply refreshes the files again.
      - name: Generate cards
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER}"
          fetch=(curl -fsSL --retry 3 --retry-delay 2 --max-time 45 -A "Mozilla/5.0")

          "${fetch[@]}" \
            "https://github-readme-stats.vercel.app/api?username=${owner}&show_icons=true&theme=github_dark&bg_color=0d1117&title_color=58A6FF&icon_color=58A6FF&text_color=8b949e&hide_border=true&rank_icon=github&custom_title=GitHub%20Stats" \
            -o profile/stats.svg

          "${fetch[@]}" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${owner}&layout=compact&langs_count=8&hide=jupyter%20notebook&theme=github_dark&bg_color=0d1117&title_color=58A6FF&text_color=8b949e&hide_border=true" \
            -o profile/top-langs.svg

          "${fetch[@]}" \
            "https://streak-stats.demolab.com?user=${owner}&theme=github-dark-blue&background=0d1117&ring=58A6FF&fire=ff6b6b&currStreakLabel=58A6FF&sideLabels=58A6FF&dates=8b949e&hide_border=true&timezone=Asia/Kolkata&hide_current_streak=true" \
            -o profile/streak.svg

      - name: Validate cards
        run: |
          set -euo pipefail

          for card in profile/stats.svg profile/top-langs.svg profile/streak.svg; do
            if [ ! -s "$card" ] || grep -qiE "something went wrong|resource not accessible|forbidden|internal server error" "$card"; then
              echo "::error file=$card::Card generation failed. Keeping the previous committed version."
              exit 1
            fi
          done

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg

          if git diff --cached --quiet; then
            echo "Cards are already up to date."
            exit 0
          fi

          git commit -m "chore: refresh profile cards"
          git push
